<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>AURA · Croquis Médico</title>
<link rel="icon" href="/favicon.ico"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FAFAFA;--card:#fff;--ink:#1a1a1a;--ink2:#555;--muted:#888;--border:#e5e5e5;--terra:#A85942;--terra-l:rgba(168,89,66,.08);--blue:#3B82F6;--red:#EF4444;--green:#22C55E;--purple:#8B5CF6;--orange:#F59E0B;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;height:100vh;-webkit-user-select:none;user-select:none}

.app{display:grid;grid-template-columns:1fr 280px;grid-template-rows:56px 1fr 64px;height:100vh;width:100vw}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:56px 1fr 64px}.right-panel{display:none}}

/* TOP BAR */
.topbar{grid-column:1/-1;display:flex;align-items:center;padding:0 1.2rem;background:var(--card);border-bottom:1px solid var(--border);gap:.75rem;z-index:20}
.topbar .logo{font-family:'Playfair Display',serif;font-weight:600;font-size:1.1rem;color:var(--terra)}
.topbar .sep{width:1px;height:28px;background:var(--border)}
.topbar .patient-name{font-weight:600;font-size:.9rem}
.topbar .patient-date{font-size:.78rem;color:var(--muted);margin-left:.3rem}
.topbar .spacer{flex:1}
.topbar .zoom-display{font-size:.78rem;color:var(--muted);background:var(--bg);padding:.25rem .6rem;border-radius:6px;font-weight:600}
.top-btn{height:36px;padding:0 .8rem;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:.8rem;font-weight:600;font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:.35rem;transition:all .12s ease}
.top-btn:hover{border-color:var(--terra);color:var(--terra)}
.top-btn.primary{background:var(--terra);color:#fff;border-color:var(--terra)}
.top-btn.primary:hover{background:#8B4533}

/* CENTER CANVAS AREA */
.canvas-area{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f0f0f0}
#drawCanvas{background:#fff;box-shadow:var(--shadow);cursor:crosshair;touch-action:none;transform-origin:center center;will-change:transform;transition:transform .15s ease}

/* BOTTOM TOOLBAR */
.toolbar{grid-column:1/2;display:flex;align-items:center;justify-content:center;gap:.2rem;padding:0 1rem;background:var(--card);border-top:1px solid var(--border)}
.tool-group{display:flex;align-items:center;gap:.15rem;padding:.25rem;background:var(--bg);border-radius:10px}
.t-btn{height:42px;min-width:42px;padding:0 .6rem;border:none;border-radius:8px;background:transparent;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:.3rem;transition:all .12s ease;font-family:inherit;white-space:nowrap}
.t-btn:hover{background:var(--terra-l);color:var(--terra)}
.t-btn.active{background:var(--terra);color:#fff;box-shadow:0 2px 8px rgba(168,89,66,.3)}
.t-btn .icon{font-size:1.1rem}
.tool-sep{width:1px;height:28px;background:var(--border);margin:0 .4rem}

.color-btn{width:28px;height:28px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .12s ease;position:relative}
.color-btn:hover{transform:scale(1.15)}
.color-btn.active{border-color:var(--ink);box-shadow:0 0 0 2px rgba(0,0,0,.1)}
.size-slider{width:80px;accent-color:var(--terra);height:4px}

/* RIGHT PANEL */
.right-panel{grid-column:2;grid-row:2/4;background:var(--card);border-left:1px solid var(--border);padding:1rem;overflow-y:auto;display:flex;flex-direction:column;gap:.8rem}
.rp-title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.rp-subtitle{font-size:.7rem;color:var(--muted);margin-top:.1rem}

.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.tpl-card{border:2px solid var(--border);border-radius:10px;padding:.4rem;cursor:pointer;text-align:center;transition:all .15s ease;overflow:hidden}
.tpl-card:hover{border-color:var(--terra)}
.tpl-card.active{border-color:var(--terra);background:var(--terra-l)}
.tpl-card img,.tpl-card svg{width:100%;height:60px;object-fit:contain;opacity:.7}
.tpl-card.active img,.tpl-card.active svg{opacity:1}
.tpl-card span{display:block;font-size:.62rem;font-weight:700;margin-top:.2rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.template-family{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;padding:.25rem;background:var(--bg);border-radius:9px}
.family-btn{border:0;background:transparent;border-radius:7px;padding:.38rem .25rem;color:var(--muted);font:700 .71rem 'DM Sans',sans-serif;cursor:pointer;transition:all .14s ease}
.family-btn:hover{color:var(--terra)}
.family-btn.active{background:#fff;color:var(--terra);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.family-note{font-size:.66rem;color:var(--muted);line-height:1.3;text-align:center;margin-top:-.35rem}

.upload-btn{width:100%;padding:.6rem;border:2px dashed var(--border);border-radius:10px;background:transparent;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--muted);text-align:center;transition:all .12s ease;font-family:inherit}
.upload-btn:hover{border-color:var(--terra);color:var(--terra);background:var(--terra-l)}

.inj-section{flex:1;overflow-y:auto}
.inj-item{display:flex;align-items:center;gap:.4rem;padding:.45rem .5rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.3rem;font-size:.72rem;transition:all .12s ease}
.inj-item:hover{border-color:var(--terra)}
.inj-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.inj-info{flex:1}
.inj-info b{font-weight:700;display:block;font-size:.72rem}
.inj-info small{color:var(--muted);font-size:.65rem}
.inj-del{border:none;background:none;color:var(--red);cursor:pointer;font-size:.75rem;opacity:.5;transition:opacity .12s}
.inj-del:hover{opacity:1}

.summary-box{padding:.6rem;background:var(--bg);border-radius:10px;font-size:.72rem}
.summary-row{display:flex;justify-content:space-between;padding:.15rem 0}
.summary-row b{color:var(--terra)}

.product-row{display:flex;gap:.3rem;align-items:center;margin-top:.3rem}
.product-row select{flex:1;padding:.4rem;border:1px solid var(--border);border-radius:8px;font-size:.75rem;font-family:inherit}
.product-row input{width:50px;padding:.4rem;border:1px solid var(--border);border-radius:8px;font-size:.75rem;text-align:center;font-family:inherit}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <span class="logo">AURA</span>
    <div class="sep"></div>
    <span class="patient-name" id="patientName">Croquis Medico</span>
    <span class="patient-date" id="patientDate"></span>
    <div class="spacer"></div>
    <span class="zoom-display" id="zoomDisplay">100%</span>
    <button class="top-btn" onclick="undo()" title="Deshacer (Ctrl+Z)">&#8617; Deshacer</button>
    <button class="top-btn" onclick="redo()" title="Rehacer (Ctrl+Y)">&#8618; Rehacer</button>
    <button class="top-btn primary" onclick="saveCroquis()">&#128190; Guardar</button>
  </header>

  <!-- CANVAS AREA -->
  <div class="canvas-area" id="canvasArea">
    <canvas id="drawCanvas" width="700" height="850"></canvas>
  </div>

  <!-- BOTTOM TOOLBAR -->
  <div class="toolbar">
    <div class="tool-group">
      <button class="t-btn" onclick="setTool('pointer')" id="tool-pointer" title="Mover lienzo ampliado (1)"><span class="icon">&#128433;</span> Mover</button>
      <button class="t-btn" onclick="setTool('eraser')" id="tool-eraser" title="Borrador (2)"><span class="icon">&#9671;</span> Borrador</button>
      <button class="t-btn active" onclick="setTool('pen')" id="tool-pen" title="Dibujar (3)"><span class="icon">&#9998;</span> Dibujar</button>
      <button class="t-btn" onclick="setTool('arrow')" id="tool-arrow" title="Flecha (4)"><span class="icon">&#8599;</span> Flecha</button>
      <button class="t-btn" onclick="setTool('text')" id="tool-text" title="Texto (5)"><span class="icon">T</span> Texto</button>
      <button class="t-btn" onclick="setTool('marker')" id="tool-marker" title="Marcas (6)"><span class="icon">&#128137;</span> Marcas</button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <div class="color-btn active" style="background:#EF4444" onclick="setColor('#EF4444',this)" title="Botox"></div>
      <div class="color-btn" style="background:#3B82F6" onclick="setColor('#3B82F6',this)" title="Ac. Hialuronico"></div>
      <div class="color-btn" style="background:#22C55E" onclick="setColor('#22C55E',this)" title="Mesoterapia"></div>
      <div class="color-btn" style="background:#F59E0B" onclick="setColor('#F59E0B',this)" title="Hilos"></div>
      <div class="color-btn" style="background:#8B5CF6" onclick="setColor('#8B5CF6',this)" title="PRP"></div>
      <div class="color-btn" style="background:#1a1a1a" onclick="setColor('#1a1a1a',this)" title="Negro"></div>
    </div>
    <div class="tool-sep"></div>
    <input type="range" class="size-slider" min="1" max="16" value="3" id="sizeSlider" oninput="brushSize=+this.value" title="Grosor"/>
    <div class="tool-sep"></div>
    <button class="t-btn" onclick="zoomIn()">+</button>
    <button class="t-btn" onclick="zoomOut()">&minus;</button>
    <button class="t-btn" onclick="zoomReset()">&#8865;</button>
  </div>

  <!-- RIGHT PANEL -->
  <aside class="right-panel">
    <div>
      <div class="rp-title">&#128203; Plantillas</div>
      <div class="rp-subtitle">AURA adapta la anatomía a la ficha del paciente</div>
    </div>
    <div class="template-family" aria-label="Anatomía de referencia">
      <button class="family-btn" id="family-female" onclick="setTemplateFamily('female')">♀ Mujer</button>
      <button class="family-btn" id="family-male" onclick="setTemplateFamily('male')">♂ Hombre</button>
    </div>
    <div class="family-note" id="familyNote"></div>
    <div class="template-grid">
      <div class="tpl-card active" onclick="loadTemplate('face-front')" id="tpl-face-front">
        <img id="tpl-face-front-img" src="/assets/face-front.png" alt="Plantilla facial frontal realista"/>
        <span>Frontal</span>
      </div>
      <div class="tpl-card" onclick="loadTemplate('face-side')" id="tpl-face-side">
        <img id="tpl-face-side-img" src="/assets/face-side-ai.png" alt="Plantilla facial lateral realista"/>
        <span>Lateral</span>
      </div>
      <div class="tpl-card" onclick="loadTemplate('lips')" id="tpl-lips">
        <img id="tpl-lips-img" src="/assets/lips-detail-ai.png" alt="Plantilla de labios realista"/>
        <span>Labios</span>
      </div>
      <div class="tpl-card" onclick="loadTemplate('body')" id="tpl-body">
        <img id="tpl-body-img" src="/assets/body-front-ai.png" alt="Plantilla corporal realista"/>
        <span>Cuerpo</span>
      </div>
    </div>
    <button class="upload-btn" onclick="uploadPhoto()">&#128247; Subir foto del paciente</button>
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)"/>

    <div style="border-top:1px solid var(--border);padding-top:.6rem;margin-top:.2rem">
      <div class="rp-title">&#128137; Producto activo</div>
      <div class="product-row">
        <select id="productSelect">
          <option value="Botox (Vistabel)">Botox (Vistabel)</option>
          <option value="Juvederm Voluma">Juvederm Voluma</option>
          <option value="Juvederm Volbella">Juvederm Volbella</option>
          <option value="Restylane">Restylane</option>
          <option value="Radiesse">Radiesse</option>
          <option value="Belotero">Belotero</option>
          <option value="Teosyal">Teosyal</option>
          <option value="Otro">Otro</option>
        </select>
        <input type="number" id="unitsInput" value="2" min="0.1" step="0.1" title="Unidades"/>
      </div>
    </div>

    <div style="border-top:1px solid var(--border);padding-top:.6rem;margin-top:.2rem">
      <div class="rp-title">&#128221; Registro de inyecciones</div>
    </div>
    <div class="inj-section" id="injectionLog">
      <div style="text-align:center;padding:1.5rem .5rem;color:var(--muted);font-size:.75rem">
        Usa la herramienta Marcas<br/>para registrar puntos de inyeccion
      </div>
    </div>
    <div class="summary-box">
      <div class="summary-row"><span>Total puntos</span><b id="totalPoints">0</b></div>
      <div class="summary-row"><span>Total unidades</span><b id="totalUnits">0</b></div>
    </div>
  </aside>
</div>

<script>
const canvas=document.getElementById('drawCanvas');
const ctx=canvas.getContext('2d');
let currentTool='pen',currentColor='#EF4444',brushSize=3;
let isDrawing=false,lastX=0,lastY=0;
let history=[],historyIdx=-1;
let arrowStart=null;
let injections=[];
let currentZoom=1;
let bgImage=null;
let panX=0,panY=0,isPanning=false,panPointerId=null,panStartX=0,panStartY=0,panOriginX=0,panOriginY=0;

const params=new URLSearchParams(location.search);
const TENANT=params.get('tenant')||'';
const LEAD=params.get('lead')||'';
const VISIT=params.get('visit')||'';
const RAW_GENDER=params.get('gender')||params.get('sex')||'';
if(params.get('name')){
  document.getElementById('patientName').textContent=decodeURIComponent(params.get('name'));
}
document.getElementById('patientDate').textContent=new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});

const COLOR_NAMES={'#EF4444':'Botox','#3B82F6':'Ac. Hialuronico','#22C55E':'Mesoterapia','#F59E0B':'Hilos','#8B5CF6':'PRP','#1a1a1a':'Nota'};

const TEMPLATE_SETS={
  female:{
    'face-front':'/assets/face-front.png',
    'face-side':'/assets/face-side-ai.png',
    'lips':'/assets/lips-detail-ai.png',
    'body':'/assets/body-front-ai.png'
  },
  male:{
    'face-front':'/assets/male-face-front-ai.png',
    'face-side':'/assets/male-face-side-ai.png',
    'lips':'/assets/male-lips-detail-ai.png',
    'body':'/assets/male-body-front-ai.png'
  }
};
let templateFamily=isMaleGender(RAW_GENDER)?'male':'female';
let activeTemplate='face-front';
let templateFamilyChangedManually=false;

function isMaleGender(value){return /^(hombre|male|masculino|m)$/i.test(String(value||'').trim());}
function isFemaleGender(value){return /^(mujer|female|femenino|f)$/i.test(String(value||'').trim());}
function refreshTemplateFamilyUI(){
  var label=templateFamily==='male'?'masculina':'femenina';
  document.getElementById('family-female').classList.toggle('active',templateFamily==='female');
  document.getElementById('family-male').classList.toggle('active',templateFamily==='male');
  var known=isMaleGender(RAW_GENDER)||isFemaleGender(RAW_GENDER);
  document.getElementById('familyNote').textContent=templateFamilyChangedManually?'Plantilla '+label+' seleccionada manualmente':(known?'Plantilla '+label+' seleccionada automáticamente':'Selecciona la anatomía de referencia');
  ['face-front','face-side','lips','body'].forEach(function(id){
    var img=document.getElementById('tpl-'+id+'-img');
    if(img){img.src=TEMPLATE_SETS[templateFamily][id];img.alt='Plantilla '+label+' '+id+' realista';}
  });
}
function setTemplateFamily(family){
  if(family===templateFamily)return;
  templateFamily=family;templateFamilyChangedManually=true;refreshTemplateFamilyUI();loadTemplate(activeTemplate);
}

const BODY_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" fill="none" stroke="#ccc" stroke-width="2"><circle cx="350" cy="100" r="60"/><path d="M290 160 Q350 175 410 160 L420 450 Q350 460 280 450Z"/><path d="M290 170 L180 350 M410 170 L520 350"/><path d="M280 450 L260 750 M420 450 L440 750"/><path d="M260 750 L240 800 L280 800 M440 750 L460 800 L420 800"/></svg>';

function loadTemplate(id){
  activeTemplate=id;
  document.querySelectorAll('.tpl-card').forEach(function(c){c.classList.remove('active')});
  var el=document.getElementById('tpl-'+id);if(el)el.classList.add('active');
  injections=[];renderInjLog();
  var src=TEMPLATE_SETS[templateFamily][id];if(!src)return;
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){bgImage=img;redrawCanvas();saveState();};
  img.onerror=function(){
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#ddd';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(350,380,180,240,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(280,340,20,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(420,340,20,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(310,480);ctx.quadraticCurveTo(350,510,390,480);ctx.stroke();
    ctx.beginPath();ctx.moveTo(350,380);ctx.lineTo(350,440);ctx.stroke();
    bgImage=null;saveState();
  };
  img.src=src;
}

function redrawCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(bgImage){
    var cw=canvas.width,ch=canvas.height;
    var iw=bgImage.naturalWidth||bgImage.width,ih=bgImage.naturalHeight||bgImage.height;
    var scale=Math.min(cw/iw,ch/ih)*0.92;
    var w=iw*scale,h=ih*scale;
    var x=(cw-w)/2,y=(ch-h)/2;
    ctx.drawImage(bgImage,x,y,w,h);
  }
}

function uploadPhoto(){document.getElementById('photoInput').click();}
function handlePhotoUpload(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      bgImage=img;
      document.querySelectorAll('.tpl-card').forEach(function(c){c.classList.remove('active')});
      injections=[];renderInjLog();
      redrawCanvas();saveState();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function setTool(t){
  currentTool=t;
  document.querySelectorAll('.t-btn').forEach(function(b){b.classList.remove('active')});
  var el=document.getElementById('tool-'+t);if(el)el.classList.add('active');
  canvas.style.cursor=t==='pointer'?(currentZoom>1?'grab':'default'):t==='eraser'?'cell':t==='text'?'text':'crosshair';
}
function setColor(c,el){
  currentColor=c;
  document.querySelectorAll('.color-btn').forEach(function(b){b.classList.remove('active')});
  if(el)el.classList.add('active');
}
function getPos(e){
  var rect=canvas.getBoundingClientRect();
  var scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
  var cx=e.touches?e.touches[0].clientX:e.clientX;
  var cy=e.touches?e.touches[0].clientY:e.clientY;
  return{x:(cx-rect.left)*scaleX,y:(cy-rect.top)*scaleY};
}

canvas.addEventListener('pointerdown',function(e){
  if(currentTool==='pointer'&&currentZoom>1){
    e.preventDefault();isPanning=true;panPointerId=e.pointerId;panStartX=e.clientX;panStartY=e.clientY;panOriginX=panX;panOriginY=panY;
    canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';return;
  }
  e.preventDefault();var pos=getPos(e);
  if(currentTool==='pointer')return;
  if(currentTool==='marker'){placeMarker(pos.x,pos.y);return;}
  if(currentTool==='text'){var txt=prompt('Texto:');if(txt){ctx.font='bold 16px "DM Sans",sans-serif';ctx.fillStyle=currentColor;ctx.fillText(txt,pos.x,pos.y);saveState();}return;}
  if(currentTool==='arrow'){arrowStart=pos;return;}
  isDrawing=true;lastX=pos.x;lastY=pos.y;
});
canvas.addEventListener('pointermove',function(e){
  if(isPanning){
    e.preventDefault();panX=panOriginX+(e.clientX-panStartX);panY=panOriginY+(e.clientY-panStartY);clampPan();applyCanvasTransform();return;
  }
  if(!isDrawing)return;e.preventDefault();var pos=getPos(e);
  if(currentTool==='pen'){
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(pos.x,pos.y);
    ctx.strokeStyle=currentColor;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }else if(currentTool==='eraser'){
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(pos.x,pos.y);
    ctx.strokeStyle='#FFFFFF';ctx.lineWidth=brushSize*6;ctx.lineCap='round';ctx.stroke();
  }
  lastX=pos.x;lastY=pos.y;
});
canvas.addEventListener('pointerup',function(e){
  if(isPanning){
    isPanning=false;if(panPointerId!==null&&canvas.hasPointerCapture(panPointerId))canvas.releasePointerCapture(panPointerId);panPointerId=null;
    canvas.style.cursor=currentTool==='pointer'&&currentZoom>1?'grab':'default';return;
  }
  if(currentTool==='arrow'&&arrowStart){
    var pos=getPos(e);drawArrow(arrowStart.x,arrowStart.y,pos.x,pos.y);arrowStart=null;saveState();return;
  }
  if(isDrawing){isDrawing=false;saveState();}
});
canvas.addEventListener('pointerleave',function(){if(isDrawing){isDrawing=false;saveState();}});
canvas.addEventListener('pointercancel',function(){if(isPanning){isPanning=false;panPointerId=null;canvas.style.cursor=currentTool==='pointer'&&currentZoom>1?'grab':'default';}if(isDrawing){isDrawing=false;saveState();}});

function placeMarker(x,y){
  var product=document.getElementById('productSelect').value;
  var units=parseFloat(document.getElementById('unitsInput').value)||0;
  ctx.save();
  // Outer ring with fill
  ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);
  ctx.fillStyle=currentColor+'22';ctx.fill();
  ctx.strokeStyle=currentColor;ctx.lineWidth=2.5;ctx.stroke();
  // Inner dot
  ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fillStyle=currentColor;ctx.fill();
  // Cross hair
  ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);
  ctx.strokeStyle=currentColor;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
  // Label badge with units
  var label=units+'U';
  ctx.font='bold 11px "DM Sans",sans-serif';
  var tw=ctx.measureText(label).width;
  var lx=x+16,ly=y-4;
  // Badge background
  ctx.beginPath();
  ctx.moveTo(lx-2,ly-10);ctx.lineTo(lx+tw+4,ly-10);ctx.lineTo(lx+tw+4,ly+4);ctx.lineTo(lx-2,ly+4);ctx.closePath();
  ctx.fillStyle=currentColor;ctx.fill();
  // Badge text
  ctx.fillStyle='#fff';
  ctx.fillText(label,lx+1,ly);
  ctx.restore();
  injections.push({x:x,y:y,color:currentColor,product:product,units:units,colorName:COLOR_NAMES[currentColor]||'—'});
  renderInjLog();saveState();
}

function drawArrow(x1,y1,x2,y2){
  var headLen=18;var angle=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle=currentColor;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-headLen*Math.cos(angle-Math.PI/6),y2-headLen*Math.sin(angle-Math.PI/6));
  ctx.lineTo(x2-headLen*Math.cos(angle+Math.PI/6),y2-headLen*Math.sin(angle+Math.PI/6));
  ctx.closePath();ctx.fillStyle=currentColor;ctx.fill();
}

function renderInjLog(){
  var el=document.getElementById('injectionLog');
  if(!injections.length){
    el.innerHTML='<div style="text-align:center;padding:1.5rem .5rem;color:var(--muted);font-size:.75rem">Usa la herramienta Marcas<br/>para registrar puntos</div>';
    document.getElementById('totalPoints').textContent='0';
    document.getElementById('totalUnits').textContent='0';return;
  }
  var html='',totalU=0;
  injections.forEach(function(inj,i){
    totalU+=inj.units;
    html+='<div class="inj-item"><div class="inj-dot" style="background:'+inj.color+'"></div><div class="inj-info"><b>'+inj.product+'</b><small>'+inj.units+'U · '+inj.colorName+'</small></div><button class="inj-del" onclick="removeInj('+i+')" title="Eliminar">&#10005;</button></div>';
  });
  el.innerHTML=html;
  document.getElementById('totalPoints').textContent=injections.length;
  document.getElementById('totalUnits').textContent=totalU.toFixed(1);
}
function removeInj(i){injections.splice(i,1);renderInjLog();}

function saveState(){historyIdx++;history=history.slice(0,historyIdx);history.push(canvas.toDataURL());}
function undo(){if(historyIdx<=0)return;historyIdx--;restoreState();}
function redo(){if(historyIdx>=history.length-1)return;historyIdx++;restoreState();}
function restoreState(){var img=new Image();img.onload=function(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);};img.src=history[historyIdx];}

function zoomIn(){currentZoom=Math.min(currentZoom+0.15,2.5);applyZoom();}
function zoomOut(){currentZoom=Math.max(currentZoom-0.15,0.4);applyZoom();}
function zoomReset(){currentZoom=1;panX=0;panY=0;applyZoom();}
function clampPan(){
  var area=document.getElementById('canvasArea');var baseW=canvas.offsetWidth||0,baseH=canvas.offsetHeight||0;
  var maxX=Math.max(0,(baseW*currentZoom-area.clientWidth)/2+18),maxY=Math.max(0,(baseH*currentZoom-area.clientHeight)/2+18);
  panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY));
}
function applyCanvasTransform(){canvas.style.transform='translate('+panX+'px,'+panY+'px) scale('+currentZoom+')';}
function applyZoom(){
  if(currentZoom<=1){panX=0;panY=0;}
  clampPan();applyCanvasTransform();
  if(currentTool==='pointer')canvas.style.cursor=currentZoom>1?'grab':'default';
  document.getElementById('zoomDisplay').textContent=Math.round(currentZoom*100)+'%';
}

function resizeCanvas(){
  var area=document.getElementById('canvasArea');
  var maxW=area.clientWidth-40,maxH=area.clientHeight-40;
  var ratio=canvas.width/canvas.height;
  var w=maxW,h=maxW/ratio;
  if(h>maxH){h=maxH;w=maxH*ratio;}
  canvas.style.width=Math.min(w,650)+'px';
  canvas.style.height=Math.min(h,780)+'px';
  clampPan();applyCanvasTransform();
}

async function saveCroquis(){
  if(!TENANT||!LEAD){alert('No se puede guardar: falta identificar al paciente o la clínica.');return;}
  var saveButton=document.querySelector('.top-btn.primary');
  var dataUrl=canvas.toDataURL('image/png');
  var WORKER=localStorage.getItem('aura_worker')||'https://aura-chat-worker.adrian-7b9.workers.dev';
  var TOKEN=localStorage.getItem('aura_token')||'';
  var STAFF_TOKEN=localStorage.getItem('staff_token')||'';
  try{
    if(saveButton){saveButton.disabled=true;saveButton.textContent='Guardando…';}
    var templateMeta=document.querySelector('.tpl-card.active')?(templateFamily+'-'+document.querySelector('.tpl-card.active').id.replace('tpl-','')):'photo';
    var headers={'Content-Type':'application/json'};if(TOKEN)headers.Authorization='Bearer '+TOKEN;if(STAFF_TOKEN)headers['X-Staff-Token']=STAFF_TOKEN;
    var res=await fetch(WORKER+'/api/patient-media',{method:'POST',headers:headers,body:JSON.stringify({tenant_id:TENANT,lead_id:LEAD,type:'croquis',visit_id:VISIT,data_url:dataUrl,template:templateMeta,injections:JSON.stringify(injections)})});
    var raw=await res.text(),j=null;try{j=JSON.parse(raw);}catch(e){}
    if(!res.ok)throw new Error((j&&j.error)?j.error:'servidor '+res.status);
    if(j.ok){alert('Croquis guardado correctamente');if(window.opener)window.opener.postMessage({type:'croquis-saved',lead:LEAD},'*');}
    else throw new Error((j&&j.error)||'desconocido');
  }catch(e){alert('No se ha podido guardar el croquis: '+e.message);}
  finally{if(saveButton){saveButton.disabled=false;saveButton.innerHTML='&#128190; Guardar';}}
}

document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
  if(e.key==='1')setTool('pointer');if(e.key==='2')setTool('eraser');
  if(e.key==='3')setTool('pen');if(e.key==='4')setTool('arrow');
  if(e.key==='5')setTool('text');if(e.key==='6')setTool('marker');
});

window.addEventListener('resize',resizeCanvas);
refreshTemplateFamilyUI();
loadTemplate('face-front');
setTimeout(resizeCanvas,200);
</script>
